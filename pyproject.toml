[tool.black]
line-length = 120

# Align ruff (run by the shared downstream-ci QA job) with the repo's existing
# black / isort / flake8 configuration so it does not introduce a second,
# conflicting style standard. Mirrors tox.ini's [flake8] settings.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
extend-ignore = ["E203"]  # matches flake8 extend-ignore (W503 is not a ruff rule)

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401", "F403"]

[build-system]
requires = ["setuptools>=61.0","setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"
[tool.pytest.ini_options]
markers = ["data: uses test data (deselect with '-m \"not data\"')",]

[project]
name = "covjsonkit"
version = "0.2.22"
dependencies = [
    "pandas<3",
    "orjson",
    "xarray",
    "covjson-pydantic",
    "conflator",
    "scipy",
]

[project.optional-dependencies]
geo = [
    "rasterio",
    "shapely",
]
grib = [
    "eccodes",
]
tests = [
    "pytest",
    "polytope-python",
]
